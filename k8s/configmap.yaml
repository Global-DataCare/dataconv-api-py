apiVersion: v1
kind: ConfigMap
metadata:
  name: preconversion-config
  namespace: preconversion
data:
  NODE_ENV: "production"
  PORT: "8080"
  HOST_INTERNAL_IP: "0.0.0.0"
  DB_PROVIDER: "firestore"
  SEARCH_PROVIDER: "postgresql"
  QUEUE_PROVIDER: "pubsub"
  STORAGE_PROVIDER: "gcs"
  NETWORK_MODE: "network"
  PRECONV_FIRESTORE_CONFIG_COLLECTION: "preconv_configs"
  PRECONV_FIRESTORE_JOB_COLLECTION: "preconv_jobs"
  PRECONV_FIRESTORE_SUBJECT_LINK_COLLECTION: "preconv_subject_links"
  SUBJECT_LINK_KEY_VERSION: "v1"
  PRECONV_ICA_BASE_URL: "https://ica.example"
  PRECONV_ICA_TIMEOUT_SECONDS: "15"
  PRECONV_PUBSUB_TOPIC_ID: "preconv-jobs"
  PRECONV_PUBSUB_SUBSCRIPTION_ID: "preconv-jobs-worker"
  PRECONV_GCS_PREFIX: "preconversion"
  POSTGRES_SEARCH_TABLE: "resource_search_index"
  PRECONV_DEFAULT_ISSUER_DID: "did:web:globaldatacare.es:employee:preconversion"
  PRECONV_DEFAULT_AUDIENCE_DID: "did:web:globaldatacare.es"
  PRECONV_DEFAULT_SUBJECT_DID_PREFIX: "did:web:globaldatacare.es"
