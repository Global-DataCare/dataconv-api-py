[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter-ingestion-py"
version = "0.9.0"
description = "External multi-vendor ingestion adapters for gwtemplate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gdc-data-utils-py @ https://github.com/Global-DataCare/gdc-data-utils-py/releases/download/v0.1.1/gdc_data_utils_py-0.1.1-py3-none-any.whl#sha256=d1e51f2b30e5f0edfa4c19eeeae769a3bb6cd67ff45b6499a7b193effc39c66e",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
ai = ["httpx>=0.27", "pydantic>=2.7"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "pydantic>=2.7", "certifi>=2024.8.30", "PyJWT[crypto]>=2.8"]
gcp = ["google-auth>=2.35", "google-cloud-firestore>=2.19", "google-cloud-pubsub>=2.25", "google-cloud-storage>=2.18"]
postgres = ["psycopg[binary]>=3.2"]
prod = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "certifi>=2024.8.30",
  "PyJWT[crypto]>=2.8",
  "google-auth>=2.35",
  "google-cloud-firestore>=2.19",
  "google-cloud-pubsub>=2.25",
  "google-cloud-storage>=2.18",
  "psycopg[binary]>=3.2",
]

[project.scripts]
adapter-ingestion = "adapter_ingestion.cli:main"
preconversion-api = "adapter_ingestion.service.main:main"
preconversion-worker = "adapter_ingestion.service.worker:main"
preconversion-cleanup = "adapter_ingestion.service.cleanup:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
