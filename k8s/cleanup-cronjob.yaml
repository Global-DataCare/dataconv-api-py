apiVersion: batch/v1
kind: CronJob
metadata:
  name: preconversion-cleanup
  namespace: preconversion
spec:
  schedule: "SCHEDULE_PLACEHOLDER"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: preconversion-sa
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: europe-west1-docker.pkg.dev/your-gcp-project/preconversion/preconversion-api:latest
              command: ["/app/scripts/container-entrypoint.sh", "PRECONV_CLEANUP_CMD", "--pretty"]
              envFrom:
                - configMapRef:
                    name: preconversion-config
                - secretRef:
                    name: preconversion-secrets
