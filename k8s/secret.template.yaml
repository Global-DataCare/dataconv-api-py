apiVersion: v1
kind: Secret
metadata:
  name: preconversion-secrets
  namespace: preconversion
type: Opaque
stringData:
  GCP_PROJECT_ID: "your-gcp-project"
  GCP_REGION: "europe-west1"
  GCS_BUCKET_NAME: "your-preconversion-bucket"
  # Generate with: openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
  SUBJECT_LINK_PROTECTION_KEY: "replace-with-32-byte-base64url-key"
  PRECONV_ICA_API_KEY: "replace-with-ica-service-key"
